<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified — PN Neet Diw</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at top center, #fafafa 0%, #f4f4f5 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #18181b;
      -webkit-font-smoothing: antialiased;
    }
    .verified-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.08), 0 4px 8px -2px rgba(0, 0, 0, 0.02);
      text-align: center;
      animation: fadeIn 0.35s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrapper {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #059669;
    }
    .icon-wrapper svg {
      width: 34px;
      height: 34px;
      stroke-width: 2.5;
    }
    .notice-text {
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.6;
      color: #18181b;
      margin: 0 0 24px;
    }
    .notice-text strong {
      display: block;
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .close-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 24px;
      border-radius: 12px;
      background: #f4f4f5;
      color: #27272a;
      border: 1px solid #e4e4e7;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .close-btn:hover {
      background: #e4e4e7;
      border-color: #d4d4d8;
    }
  </style>
</head>
<body>
  <main class="verified-card" role="main">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <div class="notice-text">
      <strong>Email verified successfully.</strong>
      You may close this tab and return to PN Neet Diw.
    </div>
    <button type="button" class="close-btn" onclick="window.close()">Close this tab</button>
  </main>
</body>
</html>
