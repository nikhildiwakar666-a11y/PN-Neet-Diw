<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle with High-Contrast Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Outer Emblem Shield Geometry -->
  <path d="M256 72 L384 128 V248 C384 324 328 392 256 422 C184 392 128 324 128 248 V128 Z" 
        fill="none" stroke="url(#crestGrad)" stroke-width="7" stroke-linejoin="round" opacity="0.9" filter="url(#subtleGlow)"/>

  <!-- Medical / Excellence Star Cross Accent -->
  <g transform="translate(256, 126) scale(0.75)">
    <path d="M0 -22 L0 22 M-22 0 L22 0" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4.5" fill="#22c55e"/>
  </g>

  <!-- Monogram PN Central Typography -->
  <!-- Stylized "P" -->
  <path d="M188 180 V324 M188 180 H238 C266 180 286 198 286 226 C286 254 266 272 238 272 H188" 
        fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized "N" Intersecting & Dynamic -->
  <path d="M266 324 V210 L332 324 V180" 
        fill="none" stroke="url(#crestGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- DIW Modern Pill Badge at Bottom -->
  <g transform="translate(256, 380)">
    <rect x="-82" y="-20" width="164" height="40" rx="20" fill="#ffffff" stroke="#27272a" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="900" font-size="20" fill="#09090b" letter-spacing="4">DIW</text>
  </g>
</svg>
